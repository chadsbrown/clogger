name: Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: logger-tui

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.BIN_NAME }}

      - name: Stage release files (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          STAGING="staging"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$STAGING/"
          cp README.md logger-tui.example.toml "$STAGING/" 2>/dev/null || true

      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" -Destination staging
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination staging }
          if (Test-Path "logger-tui.example.toml") { Copy-Item "logger-tui.example.toml" -Destination staging }

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: clogger-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error
