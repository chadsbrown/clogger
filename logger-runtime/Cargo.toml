[package]
name = "logger-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
logger-core = { path = "../logger-core" }
# Git deps use bare URLs (no `branch = "master"`) so that Cargo unifies them
# with transitive references from other git deps that use the same URL form.
# Cargo tracks the default branch automatically, and Cargo.lock pins the exact
# commit. See: https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#specifying-dependencies-from-git-repositories
qsolog = { git = "https://github.com/chadsbrown/qsolog" }
contest-engine = { git = "https://github.com/chadsbrown/contest-engine" }
riglib = { git = "https://github.com/chadsbrown/riglib", features = ["full"] }
winkey = { git = "https://github.com/chadsbrown/winkey" }
otrsp = { git = "https://github.com/chadsbrown/otrsp" }
dxfeed = { git = "https://github.com/chadsbrown/dxfeed", features = ["serde"] }
station-data = { git = "https://github.com/chadsbrown/station-data" }
tokio = { version = "1", features = ["sync"] }
chrono = "0.4"
anyhow = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
