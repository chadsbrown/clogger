[package]
name = "logger-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
logger-core = { path = "../logger-core" }
qsolog = { git = "https://github.com/chadsbrown/qsolog", branch = "master" }
contest-engine = { git = "https://github.com/chadsbrown/contest-engine", branch = "master" }
riglib = { git = "https://github.com/chadsbrown/riglib", branch = "master", features = ["full"] }
winkey = { git = "https://github.com/chadsbrown/winkey", branch = "master" }
otrsp = { git = "https://github.com/chadsbrown/otrsp", branch = "master" }
dxfeed = { git = "https://github.com/chadsbrown/dxfeed", branch = "master", features = ["serde"] }
station-data = { git = "https://github.com/chadsbrown/station-data", branch = "master" }
tokio = { version = "1", features = ["sync"] }
chrono = "0.4"
anyhow = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
