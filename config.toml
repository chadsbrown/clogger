my_call = "N9UNX"
my_zone = 4
my_name = "CHAD"
bandmap = "dual"

# Cursor style (default: blinking_block)
# Options: blinking_block, steady_block, blinking_underline, steady_underline,
#          blinking_bar, steady_bar
cursor_style = "steady_block"

# Rig control (optional — omit entire section to run without)
[[rig]]
radio_id = 1
#model = "IC-7610"        # any model from riglib: IC-7300, FT-DX10, K4, TS-890S, etc.
model = "IC-705"
#port = "/dev/ttyUSB0"
port = "/dev/ttyACM0"
baud_rate = 115200       # optional, uses model default if omitted
cw_speed = 36

# WinKeyer (optional — omit entire section to run without)
[keyer]
port = "/dev/ttyUSB0"
speed_wpm = 28           # default: 28
cw_echo = true
#contest_spacing = true   # default: false

# DX cluster spots (optional — omit entire section to run without)
[[dxfeed.sources]]
host = "dxc.nc7j.com"
port = 7373
callsign = "N9UNX"
